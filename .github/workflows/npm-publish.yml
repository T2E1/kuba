name: 🚀 Publish Package to npmjs

on:
  workflow_call:
  push:
    branches:
      - main
  # A push that fails to trigger leaves a version committed but never published,
  # with no way to release it short of an empty commit.
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install
      # The suite runs in a real browser (see vitest.config.js), so the runner
      # needs one. `--with-deps` pulls the system libraries headless Chromium
      # links against, which the image doesn't ship.
      - run: npx playwright install --with-deps chromium
      - run: bun run test
      - run: bun run release
      # Not every push to main carries a new version — a docs, test, chore or
      # ci commit doesn't bump one. Publishing unconditionally turns those into
      # a red build for a 403 that means "there was nothing to release".
      - name: Publish when the version is new
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@t2e1/kuba@$version" version >/dev/null 2>&1; then
            echo "@t2e1/kuba@$version is already published — nothing to release."
            exit 0
          fi
          npm publish --access public
        env:
          NPM_TOKEN: ${{secrets.NPM_TOKEN}}
