name: 🚀 Publish Package to npmjs

on:
  workflow_call:
  push:
    branches:
      - main
  # A push that fails to trigger leaves a version committed but never published,
  # with no way to release it short of an empty commit.
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install
      # The suite runs in a real browser (see vitest.config.js), so the runner
      # needs one. `--with-deps` pulls the system libraries headless Chromium
      # links against, which the image doesn't ship.
      - run: npx playwright install --with-deps chromium
      - run: bun run test
      - run: bun run release
      - run: npm publish --access public
        env:
          NPM_TOKEN: ${{secrets.NPM_TOKEN}}
