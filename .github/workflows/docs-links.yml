name: 🔗 Check documentation links

on:
  push:
    branches:
      - main
  pull_request:
  # Links rot without anyone touching the repository: a page moves, a service
  # shuts down. Weekly is enough to catch it before a reader does.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repository markdown — files and URLs
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --cache
            --max-cache-age 1d
            README.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md CHANGELOG.md
          fail: true

      # Built rather than read from source: '/foundations/naming' in an .mdx
      # file is a route Docusaurus resolves at build time, not a path lychee
      # can check on disk or a scheme it can filter out. Building first turns
      # every internal link into a real file lychee resolves against
      # --root-dir, and every external link into a real HTTP request — so a
      # renamed route fails here instead of on the deployed site.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build documentation site
        working-directory: website
        run: |
          npm ci
          npm run build
      - name: Documentation site — internal routes and external URLs
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --cache
            --max-cache-age 1d
            --scheme https
            --scheme http
            --root-dir ${{ github.workspace }}/website/build
            'website/build/**/*.html' website/build/llms.txt
          fail: true
