name: 📖 Deploy docs to GitHub Pages

on:
  push:
    branches:
      - main
  # Also triggerable by hand: a push event that fails to fire leaves the site
  # stale with no way to republish without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The docs are a real consumer of the published package: the site loads
      # kuba from the CDN at a pinned version (website/docusaurus.config.js).
      # A pin pointing at a version that was never published deploys a site
      # where every live example is dead, and nothing else would catch it —
      # so fail here instead of shipping it.
      - name: Verify the pinned kuba version is published
        run: |
          version=$(grep -oP "KUBA_VERSION = '\K[^']+" website/docusaurus.config.js)
          echo "website/docusaurus.config.js pins @t2e1/kuba@$version"
          curl -fsSL -o /dev/null "https://cdn.jsdelivr.net/npm/@t2e1/kuba@$version/dist/kuba.js"
          curl -fsSL -o /dev/null "https://cdn.jsdelivr.net/npm/@t2e1/kuba@$version/dist/kuba.css"

          # A pin that exists but lags the current version means the docs
          # describe behavior the loaded package doesn't have. Warn rather than
          # fail: during a release the two are briefly out of step by design.
          current=$(node -p "require('./package.json').version")
          if [ "$version" != "$current" ]; then
            echo "::warning::docs pin ($version) is behind package.json ($current) — bump it in website/docusaurus.config.js"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install and build the site
        working-directory: website
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
