name: 📖 Deploy docs to GitHub Pages

on:
  push:
    branches:
      - main
  # Also triggerable by hand: a push event that fails to fire leaves the site
  # stale with no way to republish without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history: `lastUpdated: true` (website/.vitepress/config.mts) reads
      # each page's last commit date — shown to readers in the doc footer
      # ("Last updated" / "Última atualização" / "Última actualización"), and
      # published as the JSON-LD `dateModified` and the sitemap `<lastmod>`.
      # A shallow clone would stamp every page with the date of the latest
      # commit, visibly wrong on every page.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The docs are a real consumer of the published package: the site loads
      # kuba from the CDN at a pinned version (website/.vitepress/config.mts).
      # A pin pointing at a version that was never published deploys a site
      # where every live example is dead, and nothing else would catch it —
      # so fail here instead of shipping it.
      - name: Verify the pinned kuba version is published
        run: |
          version=$(grep -oP "KUBA_VERSION = '\K[^']+" website/.vitepress/config.mts)
          echo "website/.vitepress/config.mts pins @t2e1/kuba@$version"
          curl -fsSL -o /dev/null "https://cdn.jsdelivr.net/npm/@t2e1/kuba@$version/dist/kuba.js"
          curl -fsSL -o /dev/null "https://cdn.jsdelivr.net/npm/@t2e1/kuba@$version/dist/kuba.css"

          # A pin that exists but lags the current version means the docs
          # describe behavior the loaded package doesn't have. Warn rather than
          # fail: during a release the two are briefly out of step by design.
          current=$(node -p "require('./package.json').version")
          if [ "$version" != "$current" ]; then
            echo "::warning::docs pin ($version) is behind package.json ($current) — bump it in website/.vitepress/config.mts"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install and build the site
        working-directory: website
        run: |
          npm ci
          npm run build

      # VitePress builds and exits 0 even when it finds no page to render —
      # a wrong srcDir, or content that never got converted, produces a
      # directory with assets and a 404 page and nothing else. Without this
      # check, that deploys as a site where every URL is a 404.
      - name: Verify the build produced a home page
        run: test -f website/build/index.html

      # Description, canonical, reciprocal hreflang, Open Graph with an image
      # that exists, and a JSON-LD graph whose every cited @id exists — plus a
      # sitemap with exactly the built pages and the same alternates as each
      # <head>. None of it is visible on the page, so a regression would
      # deploy silently without this.
      #
      # robots.txt is only checked for a Sitemap line that matches the site
      # address. At t2e1.github.io/kuba/ no crawler reads it (robots.txt only
      # counts at the host root); until the site has its own domain, the
      # sitemap is submitted by hand in Search Console and Bing Webmaster Tools.
      - name: Verify SEO metadata
        working-directory: website
        run: npm run seo:check

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
